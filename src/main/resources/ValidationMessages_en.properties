# The Bean Validation messages, which are user visible strings and therefore
# ours rather than Hibernate Validator's English defaults. A visitor who left
# the checkout form empty used to read "must not be blank", in English, in
# every language the application offers.
jakarta.validation.constraints.NotBlank.message=This cannot be empty
jakarta.validation.constraints.NotNull.message=This is needed
jakarta.validation.constraints.NotEmpty.message=This cannot be empty
jakarta.validation.constraints.Email.message=That is not an email address
jakarta.validation.constraints.Pattern.message=That is not a valid value
jakarta.validation.constraints.Size.message=Between {min} and {max} characters
jakarta.validation.constraints.Min.message=At least {value}
jakarta.validation.constraints.Max.message=At most {value}
bakery.phone.shape=Digits and spaces, with an optional country code
