spring.application.name=Bakery 25.3

# Vaadin
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,com.vaadin.bakery

# Database. The dataset is static SQL, so Hibernate validates and never writes DDL.
spring.datasource.url=jdbc:h2:mem:bakery;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.platform=h2
# Scripts must run before Hibernate validates, so initialization is not deferred
spring.jpa.defer-datasource-initialization=false

# Demo data anchoring, see specs/02-data-set.md
demo.shift-dates=true
demo.anchor=2026-01-05

# The assistant. Without the ai Maven profile none of this resolves to anything:
# there is no Spring AI on the classpath and the mock provider is the only one.
# With the profile, an empty key still boots, on the mock, see
# SpringAIAssistantConfiguration.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${BAKERY_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
