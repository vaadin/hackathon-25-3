diagnostics.kit.dashboard=El dashboard
diagnostics.kit.dashboardNote=Desde la raiz del proyecto, el directorio donde esta compose.yaml, y con la aplicacion ya arrancada. Grafana sale provisionado desde ops, asi que no hay nada que clicar. Al acabar, docker compose stop prometheus grafana.
diagnostics.kit.pieces=Tres programas: esta aplicacion publica los numeros, Prometheus se acuerda de ellos, Grafana los dibuja. Docker solo arranca los dos ultimos.
diagnostics.kit.auth=Si se autentica: las metricas piden un administrador, asi que el mismo fichero lleva las credenciales y Prometheus las manda en cada peticion.
diagnostics.kit.url=Sabe la URL porque lo dice ops/prometheus.yml, objetivo y ruta. Esta aplicacion no se anuncia a nadie.
diagnostics.kit.reach=Llega a la aplicacion desde dentro de Docker por host.docker.internal, no por localhost, que dentro de un contenedor es el propio contenedor. Si esta en otra maquina, pon ese host y ese puerto en ops/prometheus.yml.
