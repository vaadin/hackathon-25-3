diagnostics.kit.credentials=Las metricas y los insights piden un administrador, y el navegador lo pide con su propio dialogo: el actuator autentica con HTTP Basic, porque un scraper no puede usar un formulario de login, y la sesion de esta pantalla no llega hasta ahi. El estado es publico.
