<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakery is offline</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: light-dark(#fbf7f2, #16130f); color: light-dark(#2a2119, #f3ece4);
      text-align: center; padding: 2rem;
    }
    .card { max-width: 26rem; display: grid; gap: .75rem; }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
    p { margin: 0; opacity: .85; line-height: 1.5; }
    .hours { font-variant-numeric: tabular-nums; }
    a { color: light-dark(#b4541f, #f0a06a); }
  </style>
</head>
<body>
  <div class="card">
    <h1>No connection</h1>
    <p>The bakery is still here, your phone just cannot reach it. This page came from your device.</p>
    <p class="hours">Bakery, Calle del Horno 12: 07:30 to 20:00, closed on Sunday</p>
    <p>Call us on <a href="tel:+34910000000">+34 910 000 000</a></p>
    <p><small>This page reloads by itself when the connection comes back.</small></p>
  </div>
  <script>
    addEventListener('online', () => location.reload());
    setInterval(() => { if (navigator.onLine) location.reload(); }, 5000);
  </script>
</body>
</html>
