# The live assistant test runs outside the test profile on purpose: the live
# provider is switched off under it, because a test that talks to OpenAI is not
# a test. Everything else here matches the test profile.
spring.datasource.url=jdbc:h2:mem:bakery-live-ai;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.jpa.defer-datasource-initialization=false
# Unlike the test profile, this one moves the dataset to today. A real model
# reasons about the real date: asked what happened this week it writes
# current_date, and against data frozen in January that is a correct query with
# no rows in it.
demo.shift-dates=true
