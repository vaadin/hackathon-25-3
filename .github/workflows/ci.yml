name: Verify

on:
  push:
    branches: [ manolo ]
  pull_request:
  workflow_dispatch:

jobs:
  # The gate. Proves the application builds and passes with no OpenAI key and
  # no browser, which is the rule this project holds to.
  verify:
    runs-on: ubuntu-latest
    env:
      # Mapped here rather than read in the step's `if`, because the secrets
      # context is not available there. Empty on a fork, which is the point of
      # the condition below.
      TB_LICENSE: ${{ secrets.TB_LICENSE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The key the license checker reads from ~/.vaadin/proKey, in the shape it
      # expects: {"username": "...", "proKey": "pro-..."}. The secret carries
      # both halves as `email/pro-key`, so it is split here.
      #
      # Without this the run still passes: the commercial components skip
      # themselves and say so. What the key adds is the eight tests that assert
      # on the AI form controller, which is the only commercial component in
      # this application that validates its licence inside its constructor.
      - name: Write the Vaadin pro key
        if: env.TB_LICENSE != ''
        run: |
          mkdir -p ~/.vaadin
          printf '{"username": "%s", "proKey": "%s"}' \
            "${TB_LICENSE%%/*}" "${TB_LICENSE##*/}" > ~/.vaadin/proKey
          chmod 600 ~/.vaadin/proKey

      - name: Verify
        run: ./mvnw --batch-mode verify

  # The twelve tests that really call a model. Kept apart from the gate because
  # they cost money and need both secrets, and after it because there is no
  # point paying for them when the build is already broken.
  live:
    needs: verify
    runs-on: ubuntu-latest
    env:
      TB_LICENSE: ${{ secrets.TB_LICENSE }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Write the Vaadin pro key
        if: env.TB_LICENSE != ''
        run: |
          mkdir -p ~/.vaadin
          printf '{"username": "%s", "proKey": "%s"}' \
            "${TB_LICENSE%%/*}" "${TB_LICENSE##*/}" > ~/.vaadin/proKey
          chmod 600 ~/.vaadin/proKey

      # -Pai puts Spring AI on the classpath and the empty excludedGroups lifts
      # the live-ai exclusion the pom sets by default. Both are needed: either
      # one alone leaves the twelve tests out.
      #
      # One rerun, and only here. These tests ask a model a question in English
      # and assert on the SQL it writes, so a failure is evidence and not proof:
      # a rerun tells the difference between "the model was unlucky once" and
      # "the schema we hand it is wrong". The gate job has no reruns.
      - name: Verify with a model behind it
        if: env.OPENAI_API_KEY != '' && env.TB_LICENSE != ''
        run: >
          ./mvnw --batch-mode verify -Pai
          -Dsurefire.excludedGroups=
          -Dsurefire.rerunFailingTestsCount=1

      - name: Say why nothing ran
        if: env.OPENAI_API_KEY == '' || env.TB_LICENSE == ''
        run: |
          echo "Needs both secrets: OPENAI_API_KEY for the live tests and"
          echo "TB_LICENSE for the commercial components they exercise."
