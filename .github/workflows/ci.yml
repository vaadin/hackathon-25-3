name: Verify

on:
  push:
    branches: [ manolo ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The default profile on purpose: this job proves the application builds
      # and passes with no commercial licence, no OpenAI key and no browser.
      - name: Verify
        run: ./mvnw --batch-mode verify
